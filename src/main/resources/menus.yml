# ===================== SELETOR DE MOCHILAS =====================
selector:
  title: "<gradient:#55FFAA:#00AA55><bold>Suas Mochilas</bold></gradient>"
  size: 3
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  # slots para os tiers
  tier-slots: [10,11,12,13,14,15,16,19,20,21,22,23,24,25]
  # lore de cada tier desbloqueado (placeholders {slots}, {capacidade}, {paginas})
