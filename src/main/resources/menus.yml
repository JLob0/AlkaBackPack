      action: xp:withdraw:10
      name: "<red><bold>Retirar 10 Níveis</bold></red>"
      lore:
        - "<gray>Retira 10 níveis de XP"
        - "<gray>guardados na mochila."
        - ""
        - "<yellow>➤ <gray>Clique para retirar"
    withdraw-all:
      slot: 24
      material: REDSTONE
      action: xp:withdraw:all
      glow: true
      name: "<gradient:#FF5555:#AA0000><bold>Retirar TUDO</bold></gradient>"
      lore:
        - "<gray>Retira todo o XP guardado"
        - "<gray>na mochila."
        - ""
        - "<yellow>➤ <gray>Clique para retirar"

# ===================== MENU GERENCIAR =====================
manage:
  title: "<gradient:#55FFAA:#00AA55><bold>Gerenciar Mochila</bold></gradient>"
  size: 3
  filler:
    material: GRAY_STAINED_GLASS_PANE
    name: " "
  items:
    sort:
      slot: 11
      material: HOPPER
      action: sort
      name: "<yellow><bold>Organizar</bold></yellow>"
      lore:
        - "<gray>Empilha e ordena os itens"
        - "<gray>desta página."
        - ""
        - "<yellow>➤ <gray>Clique para organizar"
    mining:
      slot: 12
      material: IRON_PICKAXE
      action: mining
      name: "<green><bold>Minerar para o Estoque</bold></green>"
      lore:
        - "<gray>Envia blocos minerados direto"
        - "<gray>para a mochila."
        - ""
        - "<gray>Status: {status}"
        - ""
        - "<yellow>➤ <gray>Clique para alternar"
    auto:
      slot: 13
      material: PISTON
      action: auto
      name: "<aqua><bold>Coleta Automática</bold></aqua>"
      lore:
        - "<gray>Recebe itens iguais aos que já"
        - "<gray>estão na mochila automaticamente."
        - ""
        - "<gray>Status: {status}"
        - ""
        - "<yellow>➤ <gray>Clique para alternar"
    convert:
      slot: 15
      material: IRON_BLOCK
      action: convert
      name: "<green><bold>Converter Lingotes em Blocos</bold></green>"
      lore:
        - "<gray>Transforma cada 9 lingotes"
        - "<gray>em 1 bloco nesta página."
        - ""
        - "<yellow>➤ <gray>Clique para converter"
    liquids:
      slot: 19
      material: BUCKET
      action: liquids
      name: "<aqua><bold>Líquidos</bold></aqua>"
      lore:
        - "<gray>Tanques de água, lava, leite,"
        - "<gray>neve e mel da mochila."
        - ""
        - "<yellow>➤ <gray>Clique para abrir"
    xp:
      slot: 20
      material: EXPERIENCE_BOTTLE
      action: xp
      name: "<green><bold>Experiência</bold></green>"
      lore:
        - "<gray>Guarde ou retire níveis de"
        - "<gray>XP direto da mochila."
        - ""
        - "<yellow>➤ <gray>Clique para abrir"
    skins:
      slot: 21
      material: PLAYER_HEAD
      action: skins
      glow: true
      name: "<gradient:#FFAA00:#FFE055><bold>Loja de Skins</bold></gradient>"
      lore:
        - "<dark_gray><st>―――――――――――――――――――</st>"
        - "<gray>Compre novos visuais"
        - "<gray>para a sua mochila."
        - ""
        - "<yellow>➤ <gray>Clique para abrir a loja"
        - "<dark_gray><st>―――――――――――――――――――</st>"
    back:
      slot: 22
      material: ARROW
      action: back
      name: "<gray><bold>← Voltar</bold>"
      lore:
        - "<dark_gray>Volta para a mochila."

