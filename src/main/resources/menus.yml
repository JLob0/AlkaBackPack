    - "<dark_gray><st>―――――――――――――――――――</st>"
    - "<gray>Slots: <white>{slots}<gray>/<white>{capacidade}"
    - "<gray>Páginas iniciais: <white>{paginas}"
    - ""
    - "<yellow>➤ <gray>Clique para abrir"
    - "<dark_gray><st>―――――――――――――――――――</st>"
  empty-name: "<red>Nenhuma mochila desbloqueada"

