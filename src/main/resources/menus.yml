# Menus do AlkaBackpack - todos os icones, slots, textos e acoes.
# Placeholders trocados antes do parse: {capacidade}, {atual}, {moeda}, {preco},
# {nivel}, {usados}, {total}, {paginas}, {xp}, {status}, {slots}.
#
# Padrao visual (ver docs/MestreDEV-STYLE-GUIDE.md):
# - Titulos em gradiente + bold, cor por categoria (verde=funcoes da mochila,
#   roxo=progressao/upgrade, dourado=loja/skins).
# - Lore em camadas: divisor -> dado -> espaco -> acao amarela -> divisor.
# - "glow: true" so em botoes de estado ligado ou de acao monetaria principal.

