      name: "<green><bold>Informações</bold></green>"
      lore:
        - "<dark_gray><st>―――――――――――――――――――</st>"
        - "<gray>XP guardado: <yellow>{xp} <gray>níveis"
        - "<dark_gray><st>―――――――――――――――――――</st>"
    deposit-1:
      slot: 11
