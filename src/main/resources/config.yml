# AlkaBackpack Configuration
config-version: 1

settings:
  # Alternar coleta automatica ao abrir menu? (fisico)
  auto-collect-default: true
  # Segundos entre salvamentos automaticos do cache
  autosave-interval: 300
  # Segundos entre copias de seguranca (0 desativa)
  backup-interval: 0
  # Quantas copias de seguranca manter
  backup-retention: 5
  # Segundos de cooldown entre aberturas (evita spam no servidor)
  open-cooldown: 1
  # Capacidade dos tanques de liquido em baldes
  liquid-capacity: 128
  # Impede que mochilas sejam descartadas no chao (item)
  block-drop: false
  # Segundos entre reconciliacoes do cosmetico CosmeticsCore (corrige mochila
  # que sumiu/foi vendida/perdida e o toggle de preferencia do jogador)
  cosmetic-reconcile-interval: 30
  sounds:
    open: "BLOCK_NOTE_BLOCK_PLING"
    place-item: "ENTITY_ITEM_PICKUP"
    close: "CHEST_CLOSE"
    denied: "ENTITY_VILLAGER_NO"
    upgrade: "BLOCK_NOTE_BLOCK_PLING"
    sort: "BLOCK_ANVIL_USE"

# Mundos onde nao se pode abrir nem usar mochilas
disabled-worlds:
  - "mundo_criativo"

# Regioes (WorldGuard) onde nao se pode abrir nem usar mochilas
disabled-regions:
  - "spawn_pvp"

# Itens que nao podem ser colocados em nenhuma mochila
blacklist:
  enabled: true
  items:
    - "DIAMOND_SWORD"
    - "DIAMOND_AXE"
    - "NETHERITE_SWORD"
    - "NETHERITE_AXE"
    - "ALKA_BACKPACK"

